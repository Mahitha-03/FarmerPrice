<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AgriPrice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><h1>Admin overview</h1><p class="text-muted">Restricted to users with the ADMIN role.</p><div class="row g-3"><div class="col-md-6"><div class="stat"><h4>Crops</h4><h2 th:text="${#lists.size(crops)}">0</h2><p>Manage via secured /api/admin/crops endpoints.</p></div></div><div class="col-md-6"><div class="stat"><h4>Markets</h4><h2 th:text="${#lists.size(markets)}">0</h2><p>Manage via secured /api/admin/markets endpoints.</p></div></div></div><h3 class="mt-4">Crop list</h3><ul><li th:each="c : ${crops}" th:text="${c.name}"></li></ul><h3>Market list</h3><ul><li th:each="m : ${markets}" th:text="${m.name}"></li></ul></main></body></html>
