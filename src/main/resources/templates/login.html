<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | AgriPrice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container narrow py-5"><div class="card shadow-sm p-4"><h2>Welcome back</h2><p class="text-muted">Sign in to your AgriPrice account.</p><div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div><div th:if="${param.registered}" class="alert alert-success">Registration successful. Please log in.</div><form method="post" th:action="@{/login}"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-success w-100">Login</button></form><p class="mt-3 mb-0">New farmer? <a href="/register">Create account</a></p></div></main></body></html>
