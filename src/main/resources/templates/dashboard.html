<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | AgriPrice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet></head><body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Farmer dashboard</h1><p class="text-muted">Explore crops and compare available market prices.</p></div><span class="badge text-bg-success">Farmer workspace</span></div><div class="alert alert-info">Prices shown here are demo records and are not live mandi quotations.</div><div class="row g-3 mb-4"><div class="col-md-6"><div class="stat"><div class="text-muted">Active crops</div><div class="display-6" th:text="${#lists.size(crops)}">0</div></div></div><div class="col-md-6"><div class="stat"><div class="text-muted">Active markets</div><div class="display-6" th:text="${#lists.size(markets)}">0</div></div></div></div><h3>Available crops</h3><div class="row g-3"><div class="col-md-4" th:each="crop : ${crops}"><div class="card p-3 h-100"><h5 th:text="${crop.name}">Crop</h5><p class="text-muted" th:text="${crop.category}">Category</p><a class="btn btn-outline-success mt-auto" th:href="@{/api/public/crops/{id}/prices(id=${crop.id})}">View price API</a></div></div></div><h3 class="mt-5">Markets</h3><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Market</th><th>District</th><th>State</th></tr></thead><tbody><tr th:each="market : ${markets}"><td th:text="${market.name}"></td><td th:text="${market.district}"></td><td th:text="${market.state}"></td></tr></tbody></table></div></main></body></html>
