<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | AgriPrice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container narrow py-5"><div class="card shadow-sm p-4"><h2>Create farmer account</h2><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" th:action="@{/register}"><label class="form-label">Full name</label><input class="form-control mb-3" name="fullName" required maxlength="80"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Phone</label><input class="form-control mb-3" name="phone"><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-success w-100">Register</button></form></div></main></body></html>
